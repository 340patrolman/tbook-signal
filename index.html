:root{
 --bg:#f4f6fa; --card:#fff; --line:#d6dbe4; --ink:#0a1931; --ink2:#4a5568;

}
@media(prefers-color-scheme:dark){
 :root{--bg:#0f172a;--card:#1e293b;--line:#475569;--ink:#e2e8f0;--ink2:#a6b3ca;
  --accent:#3b82f6;--a:#74a2ff;--b:#d4a85c}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
 padding:calc(6px + env(safe-area-inset-top)) 8px calc(20px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:17px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:7px;
 padding:2px 2px 8px;color:var(--accent)}
h1 small{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;
 border:2px solid var(--accent);border-radius:12px;background:var(--accent);color:#fff;
 font-size:15px;font-weight:900;font-family:var(--font);cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--accent)}
.msg{font-size:13.5px;color:var(--ink2);padding:6px 2px;line-height:1.7}
.msg b{color:var(--ink)}
/* 가까운 교차로 목록 — 한 줄이 한 손가락 */
.pick{display:block;width:100%;text-align:left;min-height:52px;padding:9px 11px;margin-bottom:6px;
 background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;
 font-family:var(--font);color:var(--ink);font-size:15px;font-weight:800}
.pick i{font-style:normal;float:right;font-size:12.5px;font-weight:800;color:var(--ink2)}
.pick.on{border-color:var(--accent);border-width:2px}
/* 지금 계획 — 이 화면의 주인공 */
.now{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:7px}
.now .nm{font-size:19px;font-weight:900;letter-spacing:-.5px}
.now .d{font-size:12.5px;font-weight:800;color:var(--ink2)}
.cyc{display:flex;align-items:baseline;gap:6px;margin:2px 0 9px}
.cyc b{font-size:30px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.cyc span{font-size:13px;font-weight:800;color:var(--ink2)}
/* 현시 막대 — 각 칸의 너비가 곧 그 현시의 초다. 눈으로 길이를 견준다. */
.ring{margin:7px 0 3px}
.ring .lb{font-size:11.5px;font-weight:900;color:var(--ink2);margin-bottom:3px;letter-spacing:.3px}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar u{display:flex;align-items:center;justify-content:center;text-decoration:none;
 font-size:13px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;
 border-right:1px solid rgba(255,255,255,.55);min-width:0;overflow:hidden}
.bar u:last-child{border-right:0}
.bar u em{font-style:normal;font-size:10px;opacity:.85;margin-left:3px}
.diff{font-size:12px;font-weight:800;color:var(--warn);padding:5px 2px 0}
/* 하루 흐름 — 시간대별 주기. 언제 길어지고 짧아지는지. */
.tod{display:flex;flex-wrap:wrap;gap:5px;padding-top:4px}
.tod b{font-size:12px;font-weight:900;padding:4px 7px;border-radius:7px;
 background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tod b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tod b i{font-style:normal;font-weight:800;opacity:.7;margin-left:3px;font-size:10.5px}
.note{font-size:11.5px;color:var(--ink2);line-height:1.65;padding:7px 2px 0}
.note b{color:var(--warn)}
/* 직접 넣기 폼 — 사거리에서 장갑 낀 손으로 두드린다. 칸을 크게 둔다. */
input{width:100%;min-height:48px;padding:0 12px;margin-bottom:2px;background:var(--bg);
 color:var(--ink);border:2px solid var(--line);border-radius:10px;
 font-size:16px;font-family:var(--font);outline:none}
input:focus{border-color:var(--accent)}
label{display:block;font-size:12px;font-weight:900;color:var(--accent);margin:9px 0 3px}
.btn-row{display:flex;gap:7px;margin-top:8px}
.btn-row .btn{flex:1 1 0;min-width:0}
.diff:empty{display:none}
.src{font-size:11px;color:var(--ink2);text-align:center;padding:12px 4px 4px;line-height:1.7}
</style>

<script>
/* ══ T-Book 신호 v0.1 ══════════════════════════════════════════════════════
   교통경찰이 사거리에 나가 신호기를 조작할 때, 그 교차로가 지금 몇 현시로
   몇 초씩 도는지를 보는 도구다. 형님 지시 — 「사거리에 나가서 신호기 조작을
   해서 교통소통을 할 때가 많다」.

   자료: 경찰청 교차로기반정보서비스 · 교차로계획정보서비스(공공데이터포털)
        신호계획 2026-09-10 01:00 수집 · 교차로목록 갱신일 2024-07-01

   ⚠ 확인된 한계 — 반드시 화면에도 적는다
     · 경찰청이 공개하는 서울 교차로는 388곳뿐이다(totalCount 실측).
       성모병원·반포·고속터미널·교대역·남부터미널 사거리는 목록에 없다.
       이름으로 조회해도 0건이다. 우리가 덜 받은 것이 아니다.
     · 계획값이다. 감응식·수동조작 중에는 실제와 다르다.
     · 주기 시작 절대시각이 자료에 없다. 그래서 「몇 초 뒤 바뀜」은 못 한다.
       주기와 현시 길이는 알 수 있고, 그것이 조작에 필요한 값이다.

   통신은 없다. CSP connect-src 'none'. 자료는 전부 이 파일 안에 있다.
   ══════════════════════════════════════════════════════════════════════════ */
(function(){
 'use strict';
 function $(id){ return document.getElementById(id); }
 function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

 /* ── 자료 풀기 ─────────────────────────────────────────────────────────── */
 var CR=[], PL={}, DW={};
 (function(){
  D_CROSS.split('\n').forEach(function(l){ if(!l) return; var f=l.split('|');
   CR.push({no:f[0], nm:f[1], la:+f[2], lo:+f[3]}); });
  D_PLAN.split('\n').forEach(function(l){ if(!l) return; var f=l.split('|');
   (PL[f[0]]=PL[f[0]]||[]).push({p:+f[1], t:f[2], c:+f[3], o:+f[4],
     a:f[5].split(',').map(Number), b:f[6].split(',').map(Number)}); });
  D_DOW.split('\n').forEach(function(l){ if(!l) return; var f=l.split('|');
   (DW[f[0]]=DW[f[0]]||{})[+f[1]]=+f[2]; });
 })();
 $('n1').textContent=CR.length;
 $('n2').textContent=Object.keys(PL).reduce(function(s,k){return s+PL[k].length;},0);

 /* ── 내가 넣은 교차로 ────────────────────────────────────────────────────
    경찰청이 여는 서울 교차로는 388곳뿐이라 성모병원·반포·고속터미널처럼
    정작 자주 나가는 사거리가 빠져 있다. 그 값을 쥐고 있는 곳은 경찰서 교통과
    신호운영 담당이다 — 형님이 받아 온 것을 여기에 적어 쓴다.
    기기에만 남는다. 밖으로 나가는 길이 이 앱에는 아예 없다.
    T-Book 의 「관내별 연락처」와 같은 방식이다. */
 var MK='tbsig_mine';
 function mineGet(){ try{ var a=JSON.parse(localStorage.getItem(MK)||'[]'); return a&&a.length?a:[]; }catch(e){ return []; } }
 function mineSet(a){ try{ localStorage.setItem(MK, JSON.stringify(a)); }catch(e){} }

 /* ── 거리 ──────────────────────────────────────────────────────────────── */
 function dist(a1,o1,a2,o2){
  var R=6371000, P=Math.PI/180;
  var d1=(a2-a1)*P, d2=(o2-o1)*P;
  var h=Math.sin(d1/2)*Math.sin(d1/2)
       +Math.cos(a1*P)*Math.cos(a2*P)*Math.sin(d2/2)*Math.sin(d2/2);
  return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
 }

 /* ── 지금 적용되는 계획 고르기 ───────────────────────────────────────────
    요일코드는 문서에 뜻이 안 적혀 있다. 388곳 패턴에서 유추했다 —
    요일1·요일7 만 가운데 닷새와 달랐다(예 3111112 · 4111123).
    곧 1=일요일 … 7=토요일이고, 자바스크립트 getDay()+1 과 그대로 맞는다.
    요일계획이 0(미지정)인 교차로가 67곳 있다. 그때는 가장 작은 계획번호를
    쓰고 화면에 그렇게 밝힌다 — 없는 값을 그럴듯하게 지어내지 않는다. */
 function pickPlan(no, now){
  var rows=PL[no]; if(!rows||!rows.length) return null;
  var dow=now.getDay()+1;
  var pno=(DW[no]&&DW[no][dow])||0, guessed=false;
  if(!pno){
   var ps={}; rows.forEach(function(r){ ps[r.p]=1; });
   pno=Math.min.apply(null,Object.keys(ps).map(Number)); guessed=true;
  }
  var mine=rows.filter(function(r){ return r.p===pno; });
  if(!mine.length){ mine=rows.slice(); guessed=true; pno=mine[0].p; }
  mine.sort(function(x,y){ return x.t.localeCompare(y.t); });
  /* 지금 시각 이전에 시작한 계획 중 가장 늦은 것. 하나도 없으면 그날 마지막 것
     (자정을 넘겨 전날 밤 계획이 이어지는 경우다). */
  var hm=('0'+now.getHours()).slice(-2)+('0'+now.getMinutes()).slice(-2);
  var cur=null;
  for(var i=0;i<mine.length;i++){ if(mine[i].t<=hm) cur=mine[i]; }
  if(!cur) cur=mine[mine.length-1];
  return {row:cur, all:mine, pno:pno, guessed:guessed, dow:dow};
 }

 var DOWK=['','일','월','화','수','목','금','토'];
 var PHC=['#1d5ce1','#2e9e5b','#d97706','#8f5cd1','#0e7490','#be185d','#4a5568','#78350f'];

 /* ── 현시 막대 ─────────────────────────────────────────────────────────
    칸 너비가 곧 그 현시의 초다. 숫자를 읽기 전에 길이로 먼저 보이게 한다. */
 function barHtml(arr, cyc){
  var s='', tot=arr.reduce(function(a,b){return a+b;},0)||cyc||1;
  arr.forEach(function(v,i){
   if(v<=0) return;
   var w=(v/tot*100).toFixed(2);
   s+='<u style="width:'+w+'%;background:'+PHC[i%PHC.length]+'" title="'+(i+1)+'현시 '+v+'초">'
     +v+'<em>'+(i+1)+'</em></u>';
  });
  return '<div class="bar">'+s+'</div>';
 }

 /* 내가 넣은 교차로를 그린다. 공공데이터와 같은 모양으로 보이되 출처는 분명히 갈라 둔다 —
    어느 값이 어디서 온 것인지 헷갈리면 그것이 곧 잘못된 조작이 된다. */
 function renderMine(i, d, pos){
  var m=mineGet()[i]; if(!m){ start(); return; }
  var A=m.ph.filter(function(v){return v>0;}), sum=A.reduce(function(a,b){return a+b;},0);
  var h='<div class="card" style="border-color:var(--b);border-width:2px">';
  h+='<div class="now"><span class="nm">'+esc(m.nm)+'</span>';
  if(d!=null) h+='<span class="d">'+(d<1000?Math.round(d)+'m':(d/1000).toFixed(1)+'km')+'</span>';
  h+='</div>';
  h+='<div class="cyc"><b>'+m.c+'</b><span>초 주기</span><span>· '+A.length+'현시</span></div>';
  h+='<div class="msg">✍ <b>내가 넣은 값</b>'+(m.memo?' · '+esc(m.memo):'')
    +(m.t?' <span style="color:var(--ink2)">('+new Date(m.t).toLocaleDateString('ko-KR')+' 적음)</span>':'')+'</div>';
  h+='<div class="ring"><div class="lb">현시</div>'+barHtml(A,m.c)+'</div>';
  if(sum!==m.c) h+='<div class="diff">⚠ 현시 합 '+sum+'초가 주기 '+m.c+'초와 다릅니다 — 적은 값을 다시 보십시오</div>';
  h+='<div class="note">이 값은 <b>공공데이터가 아니라 형님이 적어 넣은 것</b>입니다. '
    +'출처와 적은 날을 스스로 관리하십시오. <b>이 기기에만 있습니다.</b></div>';
  h+='<div class="btn-row"><button class="btn sec" data-edit="'+i+'">✍ 고치기</button>'
    +'<button class="btn sec" data-del="'+i+'">🗑 지우기</button></div>';
  h+='</div>';
  $('app').innerHTML=h+listHtml(pos,'M'+i);
  bind(pos);
 }

 function render(no, d, pos){
  if(String(no).charAt(0)==='M'){ renderMine(+String(no).slice(1), d, pos); return; }
  var now=new Date(), c=CR.filter(function(x){return x.no===no;})[0];
  var P=pickPlan(no, now);
  var h='';
  h+='<div class="card">';
  h+='<div class="now"><span class="nm">'+esc(c.nm)+'</span>';
  if(d!=null) h+='<span class="d">'+(d<1000?Math.round(d)+'m':(d/1000).toFixed(1)+'km')+'</span>';
  h+='</div>';
  if(!P){ h+='<div class="msg">이 교차로는 <b>운영계획 자료가 없습니다.</b></div></div>'; $('app').innerHTML=h+listHtml(pos,no); return; }
  var r=P.row, A=r.a.filter(function(v){return v>0;}), B=r.b.filter(function(v){return v>0;});
  var same=(A.join()===B.join());
  h+='<div class="cyc"><b>'+r.c+'</b><span>초 주기</span>'
    +'<span>· '+A.length+'현시</span>'
    +'<span>· 옵셋 '+r.o+'초</span></div>';
  h+='<div class="msg">'+DOWK[P.dow]+'요일 · <b>'+r.t.slice(0,2)+':'+r.t.slice(2)+'</b> 계획'
    +(P.guessed?' <b>(요일계획 미지정 — 기본계획)</b>':'')+'</div>';
  h+='<div class="ring"><div class="lb">'+(same?'A링 = B링':'A링')+'</div>'+barHtml(A,r.c)+'</div>';
  if(!same){
   h+='<div class="ring"><div class="lb">B링</div>'+barHtml(B,r.c)+'</div>';
   h+='<div class="diff">⚠ 겹침현시 — A링과 B링이 다릅니다(좌회전 선행·후행 운영)</div>';
  }
  /* 하루 흐름 */
  h+='<div class="lb" style="font-size:11.5px;font-weight:900;color:var(--ink2);padding-top:9px">오늘 시간대별 주기</div>';
  h+='<div class="tod">';
  P.all.forEach(function(x){
   h+='<b'+(x===r?' class="on"':'')+'>'+x.t.slice(0,2)+'시<i>'+x.c+'</i></b>';
  });
  h+='</div>';
  h+='<div class="note">막대 한 칸이 한 현시이고, <b>칸 너비가 곧 그 현시의 초</b>입니다. '
    +'수치는 <b>계획값</b>이라 감응·수동 운영 중에는 실제와 다릅니다. '
    +'자료에 주기 시작 시각이 없어 <b>「몇 초 뒤 바뀜」은 알 수 없습니다.</b></div>';
  h+='</div>';
  $('app').innerHTML=h+listHtml(pos,no);
  bind(pos);
 }

 var NEAR=[], POS=null;
 function listHtml(pos, cur){
  var h='';
  if(NEAR.length){
   h+='<div class="msg" style="padding-top:4px">가까운 교차로</div>';
   NEAR.forEach(function(x){
    h+='<button class="pick'+(x.no===cur?' on':'')+'" data-no="'+x.no+'" data-d="'+Math.round(x.d)+'">'
      +(x.mine?'✍ ':'')+esc(x.nm)+'<i>'+(x.d<1000?Math.round(x.d)+'m':(x.d/1000).toFixed(1)+'km')+'</i></button>';
   });
  }
  /* 자리를 알고 있을 때만 「직접 넣기」를 내민다 — 좌표 없이 적으면 나중에 못 찾는다. */
  if(POS) h+='<button class="btn sec" style="margin-top:6px" id="addnew">✍ 이 자리 교차로 직접 넣기</button>';
  return h;
 }
 function bind(pos){
  Array.prototype.forEach.call(document.querySelectorAll('.pick'),function(b){
   b.onclick=function(){ render(b.getAttribute('data-no'), +b.getAttribute('data-d'), pos); };
  });
  var add=$('addnew'); if(add) add.onclick=function(){ form(-1, pos); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'),function(b){
   b.onclick=function(){ form(+b.getAttribute('data-edit'), pos); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){
   b.onclick=function(){
    var i=+b.getAttribute('data-del'), a=mineGet();
    if(!confirm('「'+a[i].nm+'」을 지웁니다. 되돌릴 수 없습니다.')) return;
    a.splice(i,1); mineSet(a);
    if(POS) show(POS.lat,POS.lon); else start();
   };
  });
 }

 /* ── 직접 넣기 ─────────────────────────────────────────────────────────
    적을 것은 셋뿐이다 — 이름 · 주기 · 각 현시 초.
    옵셋은 받지 않는다. 연동을 계산할 때 쓰는 값이지 조작에는 안 쓴다.
    현시 합이 주기와 다르면 저장은 하되 화면에 계속 표시해 둔다 —
    막는 것보다 눈에 띄게 두는 편이 낫다. 실제 신호가 그럴 수도 있다. */
 function form(idx, pos){
  var a=mineGet(), m=(idx>=0?a[idx]:{nm:'',c:'',ph:[],memo:''});
  var h='<div class="card" style="border-color:var(--b);border-width:2px">';
  h+='<div class="now"><span class="nm">'+(idx>=0?'고치기':'이 자리 교차로 넣기')+'</span></div>';
  h+='<div class="msg">교통과 신호운영 담당에게 받은 값을 적습니다. <b>이 기기에만 남습니다.</b></div>';
  h+='<label>교차로 이름</label><input id="f_nm" type="text" placeholder="예: 서울성모병원사거리" value="'+esc(m.nm||'')+'">';
  h+='<label>주기 (초)</label><input id="f_c" type="number" inputmode="numeric" placeholder="예: 150" value="'+(m.c||'')+'">';
  h+='<label>각 현시 초 — 빈칸으로 나눠 적으십시오</label>'
    +'<input id="f_ph" type="text" inputmode="numeric" placeholder="예: 55 32 37 26" value="'+esc((m.ph||[]).join(' '))+'">';
  h+='<label>메모 (받은 곳·날짜)</label><input id="f_memo" type="text" placeholder="예: 서초서 교통과 확인" value="'+esc(m.memo||'')+'">';
  h+='<div id="f_chk" class="diff"></div>';
  h+='<div class="btn-row" style="margin-top:8px"><button class="btn" id="f_save">저장</button>'
    +'<button class="btn sec" id="f_cancel">그만</button></div>';
  if(idx<0&&pos) h+='<div class="note">자리는 <b>지금 있는 곳</b>으로 적힙니다 — 사거리 한가운데에서 넣으십시오.</div>';
  h+='</div>';
  $('app').innerHTML=h;
  function chk(){
   var c=+$('f_c').value||0, ph=($('f_ph').value||'').trim().split(/[\s,]+/).map(Number).filter(function(v){return v>0;});
   var s=ph.reduce(function(x,y){return x+y;},0);
   $('f_chk').textContent=(c&&s&&s!==c)?('⚠ 현시 합 '+s+'초 ≠ 주기 '+c+'초'):(c&&s?('✔ 현시 합 '+s+'초 = 주기'):'');
   $('f_chk').style.color=(c&&s&&s===c)?'#2e9e5b':'';
  }
  $('f_c').oninput=chk; $('f_ph').oninput=chk; chk();
  $('f_cancel').onclick=function(){ if(POS) show(POS.lat,POS.lon); else start(); };
  $('f_save').onclick=function(){
   var nm=($('f_nm').value||'').trim(), c=+$('f_c').value||0;
   var ph=($('f_ph').value||'').trim().split(/[\s,]+/).map(Number).filter(function(v){return v>0;});
   if(!nm){ alert('교차로 이름을 적으십시오.'); return; }
   if(!(c>0)){ alert('주기(초)를 적으십시오.'); return; }
   if(!ph.length){ alert('각 현시 초를 적으십시오. 예: 55 32 37 26'); return; }
   var rec={nm:nm, c:c, ph:ph, memo:($('f_memo').value||'').trim(), t:Date.now(),
            la:(idx>=0?m.la:(pos?pos.lat:0)), lo:(idx>=0?m.lo:(pos?pos.lon:0))};
   if(idx>=0) a[idx]=rec; else a.push(rec);
   mineSet(a);
   if(POS) show(POS.lat,POS.lon); else start();
  };
 }

 function show(lat, lon, how){
  POS={lat:lat, lon:lon};
  /* 공공데이터 388곳과 내가 넣은 것을 한 목록에 섞어 거리순으로 세운다.
     섞되 출처는 목록에서도 ✍ 로 갈라 보인다. */
  var mine=mineGet().map(function(m,i){
   return {no:'M'+i, nm:m.nm, mine:1, d:dist(lat,lon,m.la,m.lo)}; });
  NEAR=CR.map(function(c){ return {no:c.no, nm:c.nm, d:dist(lat,lon,c.la,c.lo)}; })
         .concat(mine)
         .sort(function(a,b){ return a.d-b.d; }).slice(0,6);
  var top=NEAR[0];
  /* 300m 넘으면 「이 자리의 교차로」가 아니다.
     교차로 사이가 보통 200~400m 다. 신호기를 조작하려고 선 자리에서 다른 교차로의
     주기·현시를 보여주면 그것이 곧 사고다. 멀면 자료가 없다고 말하고 목록은 참고로만 둔다.
     실제로 성모병원사거리에 서면 1.7km 떨어진 강남 영동시장앞이 잡혔다 — 그 값을
     이 자리 것으로 읽으면 안 된다. 388곳뿐이라 자료가 없는 자리가 많고, 그것을 숨기지 않는다. */
  if(top.d>300){
   var far=(top.d<1000)?(Math.round(top.d)+'m'):((top.d/1000).toFixed(1)+'km');
   $('app').innerHTML='<div class="card"><div class="msg">'
    +'<b>이 자리에는 신호 자료가 없습니다.</b><br><br>'
    +'가장 가까운 것이 <b>'+esc(top.nm)+' '+far+'</b>인데, <b>다른 교차로입니다.</b> '
    +'그 값을 이 자리 신호로 읽으면 안 됩니다.<br><br>'
    +'경찰청이 공개하는 서울 교차로는 <b>388곳뿐</b>입니다. '
    +'<b>성모병원·반포·고속터미널·교대역·남부터미널</b> 사거리는 목록에 없습니다.<br><br>'
    +'교통과 신호운영 담당에게 받은 값이 있으면 <b>여기에 적어 두고 쓰실 수 있습니다.</b>'
    +'</div></div>'
    +'<div class="msg" style="padding-top:2px">아래는 <b>참고용</b>입니다 — 지금 자리의 신호가 아닙니다.</div>'
    +listHtml({lat:lat,lon:lon},null);
   bind({lat:lat,lon:lon}); return;
  }
  render(top.no, top.d, {lat:lat,lon:lon});
 }

 /* ── 자리 잡기 ─────────────────────────────────────────────────────────
    T-Book 이 이미 잡은 좌표를 주소 뒤에 붙여 넘겨준다(#lat=..&lon=..).
    그러면 GPS 를 두 번 켜지 않는다 — T-Book v22.14 에서 세운 규칙 그대로다. */
 function fromHash(){
  var m=/lat=(-?[\d.]+)&lon=(-?[\d.]+)/.exec(location.hash||'');
  return m?{lat:+m[1], lon:+m[2]}:null;
 }
 function start(){
  var h=fromHash();
  if(h){ show(h.lat,h.lon,'전달'); return; }
  $('app').innerHTML='<div class="card">'
   +'<div class="msg">사거리에서 <b>지금 자리의 교차로</b>를 잡습니다.<br>'
   +'위치는 <b>이 기기 안에서만</b> 쓰입니다 — 이 앱은 <b>바깥으로 아무것도 보내지 않습니다.</b></div>'
   +'<button class="btn" id="go">📍 지금 자리에서 찾기</button></div>';
  $('go').onclick=function(){
   var b=$('go'); b.textContent='잡는 중…'; b.disabled=true;
   if(!navigator.geolocation){ b.textContent='이 기기는 위치를 못 잡습니다'; return; }
   navigator.geolocation.getCurrentPosition(function(p){
    show(p.coords.latitude, p.coords.longitude, 'gps');
   },function(){
    b.disabled=false; b.textContent='📍 다시 시도';
    $('app').insertAdjacentHTML('beforeend',
     '<div class="msg">위치를 못 잡았습니다. 허용을 켜거나, T-Book 에서 넘어오면 좌표가 같이 옵니다.</div>');
   },{enableHighAccuracy:true, timeout:12000, maximumAge:60000});
  };
 }
 start();
 window.addEventListener('hashchange',function(){ var h=fromHash(); if(h) show(h.lat,h.lon,'전달'); });
})();
</script>
