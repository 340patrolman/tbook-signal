<style>
/* T-Book 신호 v0.4 — 사거리에서 신호기를 조작할 때 보는 화면.
   글씨는 크게, 색은 적게. 장갑 낀 손과 한낮의 햇빛을 전제한다.
   T-Book 본체의 규격을 따른다 — 작은 글씨 대비 7:1, 손가락 닿는 자리 48px. */
:root{
 --bg:#f4f6fa; --card:#fff; --line:#d6dbe4; --ink:#0a1931; --ink2:#4a5568;
 --accent:#002366; --a:#1d5ce1; --b:#b8924b; --warn:#d97706; --hot:#e11d2f;
 --k:#155e75; --go:#166534;
 --font:'Malgun Gothic','맑은 고딕',-apple-system,'Pretendard','Noto Sans KR',sans-serif;
}
@media(prefers-color-scheme:dark){
 :root{--bg:#0f172a;--card:#1e293b;--line:#475569;--ink:#e2e8f0;--ink2:#a6b3ca;
  --accent:#3b82f6;--a:#74a2ff;--b:#d4a85c;--k:#67e8f9;--go:#15803d}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
 padding:calc(6px + env(safe-area-inset-top)) 8px calc(20px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:17px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:7px;
 padding:2px 2px 8px;color:var(--accent)}
h1 small{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;
 border:2px solid var(--accent);border-radius:12px;background:var(--accent);color:#fff;
 font-size:15px;font-weight:900;font-family:var(--font);cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--accent)}
.msg{font-size:13.5px;color:var(--ink2);padding:6px 2px;line-height:1.7}
.msg b{color:var(--ink)}
/* 가까운 교차로 목록 — 한 줄이 한 손가락 */
.pick{display:block;width:100%;text-align:left;min-height:52px;padding:9px 11px;margin-bottom:6px;
 background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;
 font-family:var(--font);color:var(--ink);font-size:15px;font-weight:800}
.pick i{font-style:normal;float:right;font-size:12.5px;font-weight:800;color:var(--ink2)}
.pick.on{border-color:var(--accent);border-width:2px}
/* 지금 계획 — 이 화면의 주인공 */
.now{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:7px}
.now .nm{font-size:19px;font-weight:900;letter-spacing:-.5px}
.now .d{font-size:12.5px;font-weight:800;color:var(--ink2)}
.cyc{display:flex;align-items:baseline;gap:6px;margin:2px 0 9px;flex-wrap:wrap}
.cyc b{font-size:30px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.cyc span{font-size:13px;font-weight:800;color:var(--ink2)}
/* 현시 막대 — 각 칸의 너비가 곧 그 현시의 초다. 눈으로 길이를 견준다. */
.ring{margin:7px 0 3px}
.ring .lb{font-size:11.5px;font-weight:900;color:var(--ink2);margin-bottom:3px;letter-spacing:.3px}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar u{display:flex;align-items:center;justify-content:center;text-decoration:none;
 font-size:13px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;
 border-right:1px solid rgba(255,255,255,.55);min-width:0;overflow:hidden}
.bar u:last-child{border-right:0}
.bar u em{font-style:normal;font-size:10px;opacity:.85;margin-left:3px}
.diff{font-size:12px;font-weight:800;color:var(--warn);padding:5px 2px 0;line-height:1.65}
.diff.good{color:var(--go)}
/* 하루 흐름 — 시간대별 주기. 언제 길어지고 짧아지는지. */
.tod{display:flex;flex-wrap:wrap;gap:5px;padding-top:4px}
.tod b{font-size:12px;font-weight:900;padding:4px 7px;border-radius:7px;
 background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tod b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tod b i{font-style:normal;font-weight:800;opacity:.7;margin-left:3px;font-size:10.5px}
.note{font-size:11.5px;color:var(--ink2);line-height:1.65;padding:7px 2px 0}
.note b{color:var(--warn)}
/* 직접 넣기 폼 — 사거리에서 장갑 낀 손으로 두드린다. 칸을 크게 둔다. */
input{width:100%;min-height:48px;padding:0 12px;margin-bottom:2px;background:var(--bg);
 color:var(--ink);border:2px solid var(--line);border-radius:10px;
 font-size:16px;font-family:var(--font);outline:none}
input:focus{border-color:var(--accent)}
label{display:block;font-size:12px;font-weight:900;color:var(--accent);margin:9px 0 3px}
.btn-row{display:flex;gap:7px;margin-top:8px}
.btn-row .btn{flex:1 1 0;min-width:0}
.btn.sm{min-height:44px;font-size:13.5px;padding:0 8px}
.diff:empty{display:none}
/* v0.3 — 교통과 자료. 공공데이터(파랑 테두리 없음)·직접 넣기(금색)와 색으로 갈린다. */
.card.ksc{border-color:var(--k);border-width:2px}
.tag{font-size:12px;font-weight:900;color:var(--k);padding:0 2px 5px}
details.memo{margin-top:8px;font-size:12px;color:var(--ink2);line-height:1.65}
details.memo summary{cursor:pointer;font-weight:900;min-height:32px;display:flex;align-items:center}
/* v0.3 — 현장 측정. 누르는 단추는 크게, 판정은 굵게. */
.meas{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.lb2{font-size:12.5px;font-weight:900;color:var(--accent);margin-bottom:6px}
.btn.go{background:var(--go);border-color:var(--go);min-height:58px;font-size:16.5px}
.mrow{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;padding:6px 2px;border-bottom:1px solid var(--line);line-height:1.55}
.mrow .ok{color:var(--go)} .mrow .no{color:var(--warn)}
.iv{font-size:11.5px;font-weight:800;color:var(--ink2);padding:3px 2px 0;font-variant-numeric:tabular-nums}
.iv.no{color:var(--warn)}
.verdict{font-size:13.5px;font-weight:800;padding:8px 2px 0;line-height:1.65}
textarea{width:100%;min-height:120px;margin-top:8px;padding:8px;font-size:12.5px;font-family:var(--font);
 background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px}
.src{font-size:11px;color:var(--ink2);text-align:center;padding:12px 4px 4px;line-height:1.7}
</style>

  var cnt={A:0,B:0,AB:0,X:0,'?':0}, n=0;
  L.forEach(function(x,i){
   var j=judge(x);
   if(i>0){
    var dt=(x.t-L[i-1].t)/1000, k=Math.max(1,Math.round(dt/x.c)), per=dt/k, bad=Math.abs(per-x.c)>TOL;
    h+='<div class="iv'+(bad?' no':'')+'">↕ '+dt.toFixed(1)+'초'+(k>1?' = '+k+'주기':'')+' · 한 주기 '+per.toFixed(1)+'초 (계획 '+x.c+'초)'
      +(bad?' — <b>계획과 다릅니다</b>':'')+'</div>';
   }
   h+='<div class="mrow">'+tstr(x.t)+' · 주기 '+x.c+' · 옵셋 '+(x.o==null?'-':x.o)
     +(j?(' · A '+sgn(j.a)+' · B '+sgn(j.b)+' → <b class="'+((j.v==='X'||j.v==='?')?'no':'ok')+'">'+VK[j.v]+'</b>'):'')+'</div>';
   if(j){ cnt[j.v]++; n++; }
  });
  if(n>=2){
   var s;
   if(cnt.A>0&&cnt.A+cnt.AB===n) s='✔ <b>'+n+'번 모두 가설 A(자정 기준)</b>에 맞습니다. 이 결과를 알려 주시면 「몇 초 뒤 바뀜」을 만들 수 있습니다.';
   else if(cnt.B>0&&cnt.B+cnt.AB===n) s='✔ <b>'+n+'번 모두 가설 B(계획 시작 기준)</b>에 맞습니다. 이 결과를 알려 주시면 「몇 초 뒤 바뀜」을 만들 수 있습니다.';
   else if(cnt.X===n) s='✘ <b>'+n+'번 모두 두 가설과 다릅니다</b> — 기준이 다른 곳에 있거나, 감응·수동 운영 중이거나, 다른 현시를 누르셨습니다.';
   else if(cnt.AB===n) s='△ 이 시간대는 두 가설이 같은 시각을 가리켜 <b>가를 수 없습니다</b>. 다른 시간대에 한 번 더 재십시오.';
   else s='△ 결과가 섞였습니다 — A '+cnt.A+' · B '+cnt.B+' · 둘 다 '+cnt.AB+' · 아님 '+cnt.X+' · 애매 '+cnt['?']+'. 한두 번 더 누르십시오.';
   h+='<div class="verdict">'+s+'</div>';
  }
  if(L.length) h+='<div class="btn-row"><button class="btn sec sm" id="mcopy">📋 결과 복사</button><button class="btn sec sm" id="mclr">🗑 측정 지우기</button></div>';
  h+='<div class="note">받아 오신 <b>현시도의 1현시</b> 방향 녹색이 켜지는 <b>순간</b> 누르십시오. 한 번으로 정하지 말고 <b>두세 주기</b> 누르십시오. '
    +'누른 시각은 폰 시계(통신망 시각)를 씁니다. 기록은 <b>이 기기에만</b> 남습니다.<br>'
    +'판정이 나기 전에는 <b>「몇 초 뒤 바뀜」을 보이지 않습니다.</b></div>';
  return h+'</div>';
 }
 function measText(mk){

  L.forEach(function(x){

     +(x.s!=null?' 계획시작 '+tstr(x.s).slice(0,5):'')+(j?' · A '+sgn(j.a)+' B '+sgn(j.b)+' → '+VK[j.v]:'')+'\n';

 }
 function copyOut(txt){
  function showBox(){
   var m=document.querySelector('.meas'); if(!m) return;
   var old=$('mout'); if(old) old.parentNode.removeChild(old);
   var ta=document.createElement('textarea'); ta.id='mout'; ta.readOnly=true; ta.value=txt;
   m.appendChild(ta); ta.focus(); ta.select();
  }
  try{
   if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ var b=$('mcopy'); if(b) b.textContent='✔ 복사했습니다'; }, showBox);
   } else showBox();

 }
 function measBind(mk){
  var t=$('tap');

   try{ if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.isActive)) navigator.vibrate(40); }catch(e){}

 /* 내가 넣은 교차로를 그린다. 공공데이터와 같은 모양으로 보이되 출처는 분명히 갈라 둔다 —

 /* 교통과 자료로 그린다. 요일·시각으로 지금 패턴을 고르고, 옵셋은 적되 기준 미확인이라고 밝힌다. */

  if(P.hn||HOLM!=='auto') h+='<div class="btn-row"><button class="btn sec sm" id="holt">'+(P.hol?'요일 계획으로 보기':'공휴일 계획(TOD 4)으로 보기')+'</button></div>';

  if(k.memo&&k.memo.length){

 var CUR=null;
 function REDRAW(){ if(CUR) render(CUR.no, CUR.d, CUR.pos); }

 var NEAR=[], POS=null, HERE=null;

   });

 }
 function bind(pos){
  Array.prototype.forEach.call(document.querySelectorAll('.pick'),function(b){

  });

  });

   };

 /* ── 직접 넣기 ─────────────────────────────────────────────────────────
    적을 것은 셋뿐이다 — 이름 · 주기 · 각 현시 초.
    옵셋은 받지 않는다. 연동을 계산할 때 쓰는 값이지 조작에는 안 쓴다.
    현시 합이 주기와 다르면 저장은 하되 화면에 계속 표시해 둔다 —
    막는 것보다 눈에 띄게 두는 편이 낫다. 실제 신호가 그럴 수도 있다.
    v0.3 — 이 자리 교차로 이름을 C-ITS 에서 찾았으면 이름 칸과 메모 칸에 미리 넣는다. */
 function form(idx, pos){
  var a=mineGet(), m=(idx>=0?a[idx]:{nm:(HERE?HERE.nm:''),c:'',ph:[],memo:(HERE?'교차로 '+HERE.no:'')});
  var h='<div class="card" style="border-color:var(--b);border-width:2px">';
  h+='<div class="now"><span class="nm">'+(idx>=0?'고치기':'이 자리 교차로 넣기')+'</span></div>';
  h+='<div class="msg">교통과 신호운영 담당에게 받은 값을 적습니다. <b>이 기기에만 남습니다.</b></div>';
  h+='<label>교차로 이름</label><input id="f_nm" type="text" placeholder="예: 서울성모병원사거리" value="'+esc(m.nm||'')+'">';
  h+='<label>주기 (초)</label><input id="f_c" type="number" inputmode="numeric" placeholder="예: 150" value="'+(m.c||'')+'">';
  h+='<label>각 현시 초 — 빈칸으로 나눠 적으십시오</label>'
    +'<input id="f_ph" type="text" inputmode="numeric" placeholder="예: 55 32 37 26" value="'+esc((m.ph||[]).join(' '))+'">';
  h+='<label>메모 (받은 곳·날짜)</label><input id="f_memo" type="text" placeholder="예: 서초서 교통과 확인" value="'+esc(m.memo||'')+'">';
  h+='<div id="f_chk" class="diff"></div>';
  h+='<div class="btn-row" style="margin-top:8px"><button class="btn" id="f_save">저장</button>'
    +'<button class="btn sec" id="f_cancel">그만</button></div>';
  if(idx<0&&pos) h+='<div class="note">자리는 <b>지금 있는 곳</b>으로 적힙니다 — 사거리 한가운데에서 넣으십시오.</div>';
  h+='</div>';
  $('app').innerHTML=h;
  function chk(){
   var c=+$('f_c').value||0, ph=($('f_ph').value||'').trim().split(/[\s,]+/).map(Number).filter(function(v){return v>0;});
   var s=sum(ph);
   $('f_chk').textContent=(c&&s&&s!==c)?('⚠ 현시 합 '+s+'초 ≠ 주기 '+c+'초'):(c&&s?('✔ 현시 합 '+s+'초 = 주기'):'');
   $('f_chk').style.color=(c&&s&&s===c)?'#2e9e5b':'';
  }
  $('f_c').oninput=chk; $('f_ph').oninput=chk; chk();
  $('f_cancel').onclick=function(){ if(POS) show(POS.lat,POS.lon); else start(); };
  $('f_save').onclick=function(){
   var nm=($('f_nm').value||'').trim(), c=+$('f_c').value||0;
   var ph=($('f_ph').value||'').trim().split(/[\s,]+/).map(Number).filter(function(v){return v>0;});
   if(!nm){ alert('교차로 이름을 적으십시오.'); return; }
   if(!(c>0)){ alert('주기(초)를 적으십시오.'); return; }
   if(!ph.length){ alert('각 현시 초를 적으십시오. 예: 55 32 37 26'); return; }
   var rec={nm:nm, c:c, ph:ph, memo:($('f_memo').value||'').trim(), t:Date.now(),
            la:(idx>=0?m.la:(pos?pos.lat:0)), lo:(idx>=0?m.lo:(pos?pos.lon:0))};
   if(idx>=0) a[idx]=rec; else a.push(rec);
   mineSet(a);
   if(POS) show(POS.lat,POS.lon); else start();
  };
 }

 function show(lat, lon, how){
  POS={lat:lat, lon:lon}; HOLM='auto';
  /* 공공데이터 388곳 · 교통과 자료 · 내가 넣은 것을 한 목록에 섞어 거리순으로 세운다.
     섞되 출처는 목록에서도 📋 · ✍ 로 갈라 보인다.
     교통과 자료가 있는 번호는 경찰청 목록에서 뺀다 — 같은 교차로가 두 번 뜨지 않게, 원본이 이긴다. */
  var ks=kscItems().map(function(k,i){ return {no:'K'+i, kno:String(k.no), nm:k.nm, ksc:1, d:dist(lat,lon,k.la,k.lo)}; });
  var kn={}; ks.forEach(function(x){ kn[x.kno]=1; });
  var mine=mineGet().map(function(m,i){
   return {no:'M'+i, nm:m.nm, mine:1, d:dist(lat,lon,m.la,m.lo)}; });
  NEAR=CR.filter(function(c){ return !kn[c.no]; })
         .map(function(c){ return {no:c.no, nm:c.nm, d:dist(lat,lon,c.la,c.lo)}; })
         .concat(ks).concat(mine)
         .sort(function(a,b){ return a.d-b.d; }).slice(0,6);
  /* 이 자리 교차로 — C-ITS 2,759곳에서 120m 안의 가장 가까운 것 */
  HERE=null;
  CI.forEach(function(c){ var dd=dist(lat,lon,c.la,c.lo); if(dd<=120&&(!HERE||dd<HERE.d)) HERE={no:c.no, nm:c.nm, d:dd}; });
  var top=NEAR[0];
  /* 300m 넘으면 「이 자리의 교차로」가 아니다.
     교차로 사이가 보통 200~400m 다. 신호기를 조작하려고 선 자리에서 다른 교차로의
     주기·현시를 보여주면 그것이 곧 사고다. 멀면 자료가 없다고 말하고 목록은 참고로만 둔다.
     실제로 성모병원사거리에 서면 1.7km 떨어진 강남 영동시장앞이 잡혔다.
     v0.3 — 300m 안이어도 C-ITS 로 보아 자료 없는 다른 교차로가 50m 넘게 더 가까우면
     그 자리는 그 교차로다. 먼 자료를 이 자리 것으로 보이지 않는다. */
  var other=!!(top&&HERE&&top.no!==HERE.no&&top.kno!==HERE.no&&top.d>HERE.d+50);
  if(!top||top.d>300||other){
   var h='<div class="card"><div class="msg">';
   if(HERE) h+='이 자리 교차로 · <b>'+esc(HERE.nm)+'</b> <span style="color:var(--ink2)">(교차로 번호 <b>'+esc(HERE.no)+'</b> · '+fmtD(HERE.d)+')</span><br><br>';
   h+='<b>이 자리에는 신호 자료가 없습니다.</b><br><br>';
   if(top) h+='가장 가까운 자료가 <b>'+esc(top.nm)+' '+fmtD(top.d)+'</b>인데, <b>다른 교차로입니다.</b> '
     +'그 값을 이 자리 신호로 읽으면 안 됩니다.<br><br>';
   if(HERE) h+='교통과 신호운영 담당에게 교차로 번호(<b>'+esc(HERE.no)+'</b>)를 대고 부탁하시면 됩니다.<br><br>';
   h+='경찰청이 공개하는 서울 교차로는 <b>388곳뿐</b>입니다. '
    +'교통과에서 받은 값은 <b>불러오거나 직접 적어</b> 쓰실 수 있습니다.'
    +'</div></div>'
    +'<div class="msg" style="padding-top:2px">아래는 <b>참고용</b>입니다 — 지금 자리의 신호가 아닙니다.</div>'
    +listHtml({lat:lat,lon:lon},null);
   $('app').innerHTML=h;
   CUR=null; bind({lat:lat,lon:lon}); return;
  }
  render(top.no, top.d, {lat:lat,lon:lon});
 }

 /* ── 교통과 자료 불러오기 칸 ─────────────────────────────────────────── */
 function kscMsg(html, bad){ var m=$('kscmsg'); if(m){ m.innerHTML=html; m.className='diff'+(bad?'':' good'); } }
 function kscImport(txt){
  var o;
  try{ o=JSON.parse(txt); }catch(e){ kscMsg('파일을 읽지 못했습니다 — JSON 파일이 아닙니다.',1); return false; }
  var er=kscCheck(o);
  if(er.length){
   kscMsg('<b>불러오지 않았습니다 — 검산이 맞지 않습니다.</b><br>'+er.slice(0,8).map(esc).join('<br>')
    +(er.length>8?'<br>… 외 '+(er.length-8)+'건':''),1);
   return false;
  }
  o.at=Date.now();
  try{ localStorage.setItem(KK, JSON.stringify(o)); }catch(e){ kscMsg('저장하지 못했습니다 — 기기 저장공간을 보십시오.',1); return false; }
  kscBox();
  kscMsg('✔ <b>'+o.items.length+'곳</b>을 불러왔습니다 — 현시 합 = 주기, 시간대 주기 = 패턴 주기 검산 통과.',0);
  if(POS) show(POS.lat,POS.lon);
  return true;
 }
 function kscBox(){
  var o=kscGet(), b=$('kscbox'), h='';
  if(!b) return;
  if(EMB&&EMB.items&&EMB.items.length) h+='<div class="msg">🔒 <b>앱에 든 교통과 자료 '+EMB.items.length+'곳</b> — '
    +EMB.items.map(function(k){ return esc(k.nm); }).join(' · ')
    +'<br><span style="font-size:12px">확인코드로 풀렸습니다. 이 기기 밖으로 나가지 않습니다.</span></div>';
  if(o){
   h+='<div class="msg">📋 교통과 자료 <b>'+o.items.length+'곳</b> — '+o.items.map(function(k){ return esc(k.nm); }).join(' · ')
     +'<br><span style="font-size:12px">불러온 날 '+new Date(o.at).toLocaleDateString('ko-KR')+(o.made?' · 만든 날 '+esc(o.made):'')+'</span></div>';
   h+='<div class="btn-row"><button class="btn sec sm" id="kscload">📂 다시 불러오기</button><button class="btn sec sm" id="kscdel">🗑 지우기</button></div>';
  } else {
   h+='<button class="btn sec" id="kscload">📂 교통과 자료 불러오기</button>';
   h+='<div class="note">교통과에서 받은 신호 자료 파일(.json)을 불러옵니다. <b>이 기기에만 저장</b>되고, '
     +'이 앱 파일(공개 저장소)에는 들어 있지 않습니다.</div>';
  }
  h+='<div id="kscmsg" class="diff"></div>';
  b.innerHTML=h;
  $('kscload').onclick=function(){ var f=$('kscf'); f.value=''; f.click(); };
  var del=$('kscdel'); if(del) del.onclick=function(){
   if(!confirm('불러온 교통과 자료를 이 기기에서 지웁니다.')) return;
   try{ localStorage.removeItem(KK); }catch(e){}
   kscBox(); if(POS) show(POS.lat,POS.lon);
  };
 }
 $('kscf').onchange=function(){
  var f=this.files&&this.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ kscImport(String(r.result)); };
  r.onerror=function(){ kscMsg('파일을 읽지 못했습니다.',1); };
  r.readAsText(f,'utf-8');
 };

 /* ── 자리 잡기 ─────────────────────────────────────────────────────────
    T-Book 이 이미 잡은 좌표를 주소 뒤에 붙여 넘겨준다(#lat=..&lon=..).
    그러면 GPS 를 두 번 켜지 않는다 — T-Book v22.14 에서 세운 규칙 그대로다. */
 function fromHash(){
  var m=/lat=(-?[\d.]+)&lon=(-?[\d.]+)/.exec(location.hash||'');
  return m?{lat:+m[1], lon:+m[2]}:null;
 }
 function start(){
  var h=fromHash();
  if(h){ show(h.lat,h.lon,'전달'); return; }
  CUR=null;
  $('app').innerHTML='<div class="card">'
   +'<div class="msg">사거리에서 <b>지금 자리의 교차로</b>를 잡습니다.<br>'
   +'위치는 <b>이 기기 안에서만</b> 쓰입니다 — 이 앱은 <b>바깥으로 아무것도 보내지 않습니다.</b></div>'
   +'<button class="btn" id="go">📍 지금 자리에서 찾기</button></div>';
  $('go').onclick=function(){
   var b=$('go'); b.textContent='잡는 중…'; b.disabled=true;
   if(!navigator.geolocation){ b.textContent='이 기기는 위치를 못 잡습니다'; return; }
   navigator.geolocation.getCurrentPosition(function(p){
    show(p.coords.latitude, p.coords.longitude, 'gps');
   },function(){
    b.disabled=false; b.textContent='📍 다시 시도';
    $('app').insertAdjacentHTML('beforeend',
     '<div class="msg">위치를 못 잡았습니다. 허용을 켜거나, T-Book 에서 넘어오면 좌표가 같이 옵니다.</div>');
   },{enableHighAccuracy:true, timeout:12000, maximumAge:60000});
  };
 }
 /* ── 확인코드 ─────────────────────────────────────────────────────────
    T-Book 본체와 같은 방식이다. 한 번 넣으면 그 기기에서는 다시 묻지 않는다.
    맞는 코드라야 앱에 든 교통과 자료가 풀리므로, 코드 확인과 자료 풀기가 한 번에 끝난다. */
 function gateMsg(o){ return (o==='nocrypto')?'이 주소에서는 잠금을 풀 수 없습니다 — <b>https</b> 로 여십시오.':'확인코드가 다릅니다.'; }
 function gate(msg){
  var kb=$('kscbox'); if(kb) kb.style.display='none';
  $('app').innerHTML='<div class="card"><div class="now"><span class="nm">🔒 확인코드</span></div>'
   +'<div class="msg">교통경찰 업무용입니다. <b>확인코드</b>를 넣으십시오.<br>'
   +'한 번 넣으면 <b>이 기기에서는 다시 묻지 않습니다.</b></div>'
   +'<input id="gc" type="text" autocomplete="off" placeholder="확인코드" aria-label="확인코드">'
   +'<div id="gm" class="diff">'+(msg||'')+'</div>'
   +'<button class="btn" id="gb" style="margin-top:8px">들어가기</button></div>';
  var go=function(){
   var c=($('gc').value||'').trim(); if(!c){ $('gc').focus(); return; }
   var b=$('gb'); b.disabled=true; b.textContent='푸는 중…';
   unlock(c).then(function(o){
    if(!o||o==='nocrypto'){ gate(gateMsg(o)); return; }
    EMB=o; try{ localStorage.setItem(GK,c); }catch(e){}
    var kb2=$('kscbox'); if(kb2) kb2.style.display='';
    kscBox(); start();
   });
  };
  $('gb').onclick=go;
  $('gc').onkeydown=function(e){ if(e.key==='Enter'||e.keyCode===13) go(); };
  try{ $('gc').focus(); }catch(e){}
 }
 (function boot(){
  var c=null; try{ c=localStorage.getItem(GK); }catch(e){}
  if(!c){ gate(); return; }
  unlock(c).then(function(o){
   if(o&&o!=='nocrypto'){ EMB=o; kscBox(); start(); return; }
   /* 저장해 둔 코드가 안 풀리면(판이 바뀌었거나 값이 깨졌으면) 지우고 다시 묻는다 */
   if(o!=='nocrypto'){ try{ localStorage.removeItem(GK); }catch(e){} }
   gate(gateMsg(o));
  });
 })();
 window.addEventListener('hashchange',function(){ var h=fromHash(); if(h&&EMB) show(h.lat,h.lon,'전달'); });
})();
</script>
